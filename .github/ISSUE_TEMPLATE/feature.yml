name: Feature request
description: Something repown should do, or do differently.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem it solves
      description: What were you trying to do, and where did repown get in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: Related decisions
      description: If an ADR in docs/decisions/ rules this out, say why it should change.
