# Keeps the pinned actions (commit SHAs, ADR-015) and the npm dependencies current.
# Each update is a pull request that runs CI like any other; nothing merges itself.
# The one runtime dependency, @clack/prompts (ADR-016), is pinned exactly; `increase`
# keeps it exact rather than widening it to a range.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7        # let a new release age a week before proposing it
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    versioning-strategy: increase
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
