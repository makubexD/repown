# CI for repown.
#
# WHY IT RUNS ON LINUX AND MACOS AS WELL AS WINDOWS. Every line of this tool was
# written and verified on one Windows machine, and it is full of things that are
# quietly platform-specific: path separators, the `.exe` suffix when locating
# Git Credential Manager, `process.platform` branches in the config-directory
# lookup, and line endings in a file that `sh` has to execute. A test suite that
# only ever runs where it was written cannot see any of that.
#
# WHY THE PACKAGE IS INSTALLED, NOT JUST BUILT. `npm test` never touches the
# `bin` wiring, so a broken entry point -- the single thing that would make an
# install useless -- passes every test. The last job packs the tarball, installs
# it globally the way a user would, and runs the binary.
#
# No services, no secrets, no network beyond the registry: the tests drive real
# git against sandboxes under the runner's temp directory, with GIT_CONFIG_GLOBAL
# and GIT_CONFIG_SYSTEM pointed at empty files so the runner's own configuration
# cannot influence a result.
#
# WHY WINDOWS IS THREE SHARDS AND LINUX AND MACOS ARE NOT. One Windows Test
# step took 621 s on Node 24 and 655 s on Node 22; the job was 660-695 s
# (run 36727911874). Three shards per Node (22 and 24) brought the slowest
# job to 319 s, with Test steps of 55-278 s, when TEMP pointed at RUNNER_TEMP
# and Defender skipped it (run 36775604717). The same shards without that
# tweak: slowest job 375 s, Test steps 61-320 s, summed Test time 1032 s
# against 893 s with it (run 36776320265). The tweak stays. Linux and macOS
# stay one unsharded `npm test` each: ubuntu finishes in about 1.5 min, and
# what macOS adds is a filesystem, which one Node 24 job already exercises.
# Every test still runs on every OS. A shard cannot split a file, and shard 3
# is bound by test/wizard-setup.test.ts, the largest one.
#
# WHY ONE UBUNTU ROW FORCES COLOUR. The extra ubuntu Node 24 job sets
# FORCE_COLOR and CLICOLOR_FORCE to 1, so a test that leaks either fails CI.
# The other rows leave the variables unset. A test that wants colour sets it.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs this whole workflow before it publishes a tag.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "test (${{ matrix.os }}, node ${{ matrix.node }}${{ matrix.shard && format(', shard {0}/3', matrix.shard) || '' }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux on Node 22 and 24, because that is where this actually runs
        # alongside Windows. macOS gets one job rather than a full
        # row: what it adds over Linux is a different filesystem and path
        # case-sensitivity, which one configuration exercises just as well as two.
        # Windows is not in `os`. Each Node is three include rows (shard 1, 2
        # and 3), so those tests are not also run unsharded. The three shards
        # together cover every test file once.
        # 22, not 20. The SOURCE needs a newer Node than the shipped package
        # does, and the two requirements are genuinely different:
        #   - running the tests needs glob support in `node --test`, and type
        #     stripping to import .ts directly. Node 20 has neither.
        #   - running the PACKAGE needs neither, because it ships compiled JS.
        # So `engines` stays at >=20, and the install job below proves that claim
        # on Node 20 rather than leaving it as an assertion.
        os: [ubuntu-latest]
        node: ['22', '24']
        include:
          - os: macos-latest
            node: '24'
          - os: ubuntu-latest
            node: '24'
            force_color: '1'
          - os: windows-latest
            node: '22'
            shard: 1
          - os: windows-latest
            node: '22'
            shard: 2
          - os: windows-latest
            node: '22'
            shard: 3
          - os: windows-latest
            node: '24'
            shard: 1
          - os: windows-latest
            node: '24'
            shard: 2
          - os: windows-latest
            node: '24'
            shard: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The suite shells out to git constantly, so its version is worth having
      # in the log when a failure turns out to be version-dependent.
      - name: Versions
        run: |
          node --version
          npm --version
          git --version

      - run: npm ci

      # test/paste.test.ts runs printed commands through every shell it finds; Linux is
      # where zsh and fish are measured (macOS has zsh, Windows has cmd and PowerShell).
      - name: Install zsh and fish for the paste test
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish

      - name: Typecheck and build
        run: npm run build

      # Windows process creation and Defender scanning dominate the git-heavy
      # suite. Pointing TEMP at RUNNER_TEMP and excluding it was measured faster.
      - name: Point TEMP at RUNNER_TEMP and exclude it from Defender
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'repown-tmp'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          foreach ($path in @($dir, $env:GITHUB_WORKSPACE)) {
            try {
              Add-MpPreference -ExclusionPath $path -ErrorAction Stop
            } catch {
              $msg = $_.Exception.Message -replace '\r?\n', ' '
              Write-Host "::warning::Defender exclusion was not applied for ${path}: $msg"
            }
          }
          "TEMP=$dir" >> $env:GITHUB_ENV
          "TMP=$dir" >> $env:GITHUB_ENV

      - name: Test
        if: "matrix.force_color != '1' && !matrix.shard"
        run: npm test

      # ubuntu Node 24 forces colour so a leak of these variables fails CI.
      - name: Test
        if: "matrix.force_color == '1' && !matrix.shard"
        run: npm test
        env:
          FORCE_COLOR: '1'
          CLICOLOR_FORCE: '1'

      # bash so the quoted glob is passed to node, the same way npm test does.
      - name: Test
        if: matrix.shard
        shell: bash
        run: node --test --test-shard=${{ matrix.shard }}/3 "test/*.test.ts"

  # Deliberately on the OLDEST Node the package claims to support. `engines` says
  # >=20, and this is what makes that a tested fact rather than a hopeful number:
  # the tarball is packed with Node 24 below, then installed and driven on Node 20.
  install:
    name: install on the oldest supported Node (20)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Build with a Node new enough to run the toolchain...
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # `npm pack` runs prepare, so this is the exact tarball a publish would
      # produce. pack:check (scripts/release/pack.ts) refuses it unless it holds
      # package.json, npm-shrinkwrap.json, dist/cli.js, README, LICENSE and CHANGELOG, and no source maps (they
      # would point at src/, which is not shipped), sources or tests.
      - name: Pack
        run: |
          npm pack
          ls -l repown-*.tgz
          npm run pack:check

      # ...then switch to the oldest supported Node, so everything below runs
      # against the version a user on the stated minimum would actually have.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Install it globally and run it
        run: |
          node --version
          npm install -g ./repown-*.tgz
          repown --version
          repown --help

      # A CLI that pins identity per clone must say so plainly when there is no
      # clone, rather than crashing or reporting something misleading.
      - name: It reports honestly outside a repository
        run: |
          mkdir -p /tmp/not-a-repo && cd /tmp/not-a-repo
          if repown; then echo "expected a non-zero exit outside a repository"; exit 1; fi
          repown 2>&1 | grep -q 'Not a git repository'

      - name: It pins a real clone end to end
        run: |
          export REPOWN_CONFIG_DIR="$RUNNER_TEMP/repown-config"
          git init -q -b main "$RUNNER_TEMP/demo"
          cd "$RUNNER_TEMP/demo"
          git remote add origin https://github.com/octocat/hello-world.git

          repown accounts add octocat --name 'Octo Cat' --email octocat@users.noreply.github.com
          repown use octocat
          repown guard on

          test "$(git config --local --get user.name)" = 'Octo Cat'
          test "$(git config --local --get credential.https://github.com.username)" = 'octocat'
          test -f .git/hooks/pre-push

          # The hook is executed by `sh`, which rejects a CRLF script with
          # "bad interpreter" -- a failure that only ever appears at push time.
          ! grep -q $'\r' .git/hooks/pre-push

          # The path every installed hook takes: `guard check`, on Node 20. A
          # commit of our own is pushed; a foreign-authored one is refused.
          git init -q --bare "$RUNNER_TEMP/remote.git"
          git remote add local "$RUNNER_TEMP/remote.git"
          git commit -q --allow-empty -m ours
          git push -q local HEAD:refs/heads/main
          git -c user.email=someone@example.invalid commit -q --allow-empty -m foreign
          if git push -q local HEAD:refs/heads/main; then echo "a foreign-authored push was not refused"; exit 1; fi

          repown off
          test -z "$(git config --local --get user.name)"
