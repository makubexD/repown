# Renders demo/demo.gif from demo/demo.tape. Run by hand (Actions -> demo -> Run
# workflow), then download the `demo-gif` artifact and commit it.
#
# Rendered here rather than locally because VHS drives a headless browser through
# ttyd, which is reliable on Linux and was not on the Windows machine this was
# written on. The tape runs `src/cli.ts` straight from the checkout, so the GIF
# always shows the code at the commit it was rendered from.

name: demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # the render step needs no token, so none is left in .git/config

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Third-party, so pinned to a commit (v2 when pinned) rather than a movable tag.
      # Used only to install vhs, ttyd and ffmpeg: running the tape ourselves keeps
      # its output in this log and fails the job if no GIF comes out.
      - uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf

      - name: Render
        run: |
          vhs demo/demo.tape
          ls -la demo
          find / -xdev -name '*.gif' -newer demo/demo.tape 2>/dev/null || true
          ffmpeg -hide_banner -version | head -1
          test -s demo/demo.gif

      - uses: actions/upload-artifact@v4
        with:
          name: demo-gif
          path: demo/demo.gif
          if-no-files-found: error
