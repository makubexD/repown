# Renders demo/demo.gif from demo/demo.tape. Run by hand (Actions -> demo -> Run
# workflow), then download a `demo-gif-*` artifact and commit it.
#
# Rendered here rather than locally because VHS drives a headless browser through
# ttyd, which did not work on the Windows machine this was written on. The tape
# runs `src/cli.ts` straight from the checkout, so the GIF always shows the code at
# the commit it was rendered from.

name: demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # the render step needs no token, so none is left in .git/config

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Third-party, so pinned to a commit (v2 when pinned) rather than a movable tag.
      # Used only to install vhs, ttyd and ffmpeg: running the tape ourselves keeps
      # its output in this log and fails the job if no GIF comes out.
      - uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf

      - name: Render
        run: |
          # Ubuntu 24.04 stops the headless browser vhs drives from sandboxing
          # itself; vhs then captures no frames and says nothing.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # The action installs a nightly ffmpeg; Ubuntu's own goes first on PATH.
          sudo apt-get install -y -qq ffmpeg >/dev/null
          export PATH="/usr/bin:$PATH"
          vhs demo/demo.tape
          test -s demo/demo.gif

      - uses: actions/upload-artifact@v4
        with:
          name: demo-gif-${{ matrix.os }}
          path: demo/demo.gif
          if-no-files-found: error
