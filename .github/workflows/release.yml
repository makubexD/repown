# Release: publish a pushed v* tag to npm and create its GitHub Release.
#
# HOW A RELEASE STARTS. `npm run release:<bump>` makes the version commit and
# the annotated tag locally; `git push --follow-tags` pushes both, and the tag
# starts this workflow (docs/RELEASING.md, ADR-015).
#
# NO NPM TOKEN. npm trusted publishing authenticates this exact file
# (makubexD/repown, .github/workflows/release.yml, environment `npm`) through
# GitHub's OIDC token, so there is no secret to leak or rotate, and provenance
# is attached automatically. npm checks the CALLING workflow's filename, which
# is why publishing lives here and not in ci.yml. Renaming this file or the
# environment breaks publishing until the trusted publisher on npmjs.com is
# updated.
#
# THE GATE IS OUTSIDE THIS FILE. A tag runs the release.yml stored at the
# tagged commit, so a check written here can be deleted by whoever tags. The
# `npm` environment (deployments from v* tags only) and the v* tag ruleset
# are repository settings that no commit can change.
#
# LEAST PRIVILEGE PER JOB. Everything that runs repository or dependency code
# (install, build, pack, the release tool) happens in `build`, which holds no
# token. `publish` only runs npm on the packed tarball, and is the one job that
# can mint an npm OIDC token. `github-release` only runs gh.
#
# SAFE TO RE-RUN. A version already on the registry is not published again (a
# version number can never be reused), and an existing GitHub Release is left
# alone. A re-run uses the tagged commit's workflow: a fix to this file needs a
# new version.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same matrix and Node 20 install proof every push to main gets.
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}
      already: ${{ steps.published.outputs.already }}
    steps:
      # Full history, to prove the tag is on main; no stored credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: The tag matches package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A prerelease (1.2.0-beta.0) must never become `latest`.
          case "$version" in *-*) echo "dist-tag=next" >> "$GITHUB_OUTPUT";; *) echo "dist-tag=latest" >> "$GITHUB_OUTPUT";; esac

      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      # Only a printed version counts as "published": a missing version (E404)
      # or a registry error prints nothing, and a real duplicate would then
      # still be refused by npm publish itself.
      - name: Already on npm?
        id: published
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -n "$(npm view "repown@$VERSION" version 2>/dev/null)" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # No dependency lifecycle scripts; the build runs explicitly.
      - run: npm ci --ignore-scripts
      - run: npm run build

      - name: Pack, and check what the tarball holds
        run: |
          npm pack --ignore-scripts --json > "$RUNNER_TEMP/pack.json"
          node scripts/release.ts check package "$RUNNER_TEMP/pack.json"

      # Before anything is published: a version with no CHANGELOG notes stops here.
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/release.ts changelog notes "$VERSION" > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md has an empty section for $VERSION"; exit 1; fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            repown-${{ steps.version.outputs.version }}.tgz
            notes.md
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.already == 'false'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write   # npm trusted publishing (OIDC); nothing else
    steps:
      # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1; npm is pinned
      # exactly, because it runs with the OIDC token.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm install -g npm@11.20.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release

      - name: Publish the packed tarball
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
        run: npm publish "./repown-$VERSION.tgz" --ignore-scripts --tag "$DIST_TAG"

  github-release:
    needs: [build, publish]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create; nothing else
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo "release exists"; exit 0; fi
          prerelease=""
          if [ "$DIST_TAG" = "next" ]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md $prerelease
