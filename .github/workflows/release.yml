# Release: publish a pushed v* tag to npm and create its GitHub Release.
#
# HOW A RELEASE STARTS. `npm run release:<bump>` makes the version commit and
# the annotated tag locally; `git push --follow-tags` pushes both, and the tag
# starts this workflow (docs/RELEASING.md, ADR-015). Pushing the tag is the
# approval.
#
# NO NPM TOKEN. npm trusted publishing authenticates this exact file
# (makubexD/repown, .github/workflows/release.yml) through GitHub's OIDC token,
# so there is no secret to leak or rotate, and provenance is attached
# automatically. npm checks the CALLING workflow's filename, which is why the
# publish job lives here and not in ci.yml. Renaming this file breaks
# publishing until the trusted publisher on npmjs.com is updated.
#
# SAFE TO RE-RUN. A version already on the registry is not published again (a
# version number can never be reused), so re-running a failed release only
# does what is still missing.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same matrix and Node 20 install proof every push to main gets.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create
      id-token: write   # npm trusted publishing (OIDC)
    steps:
      # Full history, to prove the tag is on main. No stored credentials: the
      # only token this job needs is passed to gh explicitly.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1.
      # No registry-url: that writes an .npmrc expecting NODE_AUTH_TOKEN, and
      # there is no token here, only OIDC.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - run: npm install -g npm@^11.5.1

      - name: The tag matches package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A prerelease (1.2.0-beta.0) must never become `latest`.
          case "$version" in *-*) echo "dist-tag=next" >> "$GITHUB_OUTPUT";; *) echo "dist-tag=latest" >> "$GITHUB_OUTPUT";; esac

      # Releases are cut from main only. A tag pushed at any other commit would
      # otherwise publish it.
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Already on npm?
        id: published
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Only a printed version counts as "published": a missing version (E404)
          # or a registry error prints nothing, and a real duplicate would then
          # still be refused by npm publish itself.
          if [ -n "$(npm view "repown@$VERSION" version 2>/dev/null)" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # No dependency lifecycle scripts in a job that can mint an npm OIDC token:
      # install with --ignore-scripts, then build explicitly. The tests already
      # ran in the ci job, so publish skips prepublishOnly too.
      - run: npm ci --ignore-scripts
      - run: npm run build

      - run: npm run pack:check

      - name: Publish
        if: steps.published.outputs.already == 'false'
        env:
          DIST_TAG: ${{ steps.version.outputs.dist-tag }}
        run: npm publish --ignore-scripts --tag "$DIST_TAG"

      # Notes go to a file first, so a missing CHANGELOG section fails this step
      # instead of creating a release with an empty body.
      - name: GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.dist-tag }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo "release exists"; exit 0; fi
          prerelease=""
          if [ "$DIST_TAG" = "next" ]; then prerelease="--prerelease"; fi
          node scripts/release.ts changelog notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then echo "CHANGELOG.md has an empty section for $VERSION"; exit 1; fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" $prerelease
